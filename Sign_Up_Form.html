<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="images/logo.png" type="image/png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <title>Sign Up Form</title>
  </head>
  <style>
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #d8d8ff, #f4f4ff);
    }
  </style>
  <body>
    <a href="index.html" class="site-logo" aria-label="Voyage by Sofeeyah home">
      <img
        src="images/logo.png"
        class="site-logo"
        alt="logo"
        width="150px"
        height="70px"
        style="margin: 20px 10px"
      />
    </a>
    <!-- Hamburger -->
    <div class="hamburger" onclick="myFunction()">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <path
          d="M3 6h18M3 12h18M3 18h18"
          stroke="purple"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </div>
    <!-- Nav -->
    <nav>
      <ul class="nav-links" id="mynav">
        <li>
          <a href="index.html">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="36"
              height="36"
              viewBox="0 0 36 36"
              fill="#B519DD"
            >
              <!-- Home icon -->
              <path d="M6 16 L18 6 L30 16 V30 H22 V22 H14 V30 H6 V16 Z" />
            </svg>
            <span class="nav-text">Home</span></a
          >
        </li>
        <li>
          <a href="about.html">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="36"
              height="36"
              viewBox="0 0 36 36"
              fill="#B519DD"
            >
              <!-- User icon (head + body connected) -->
              <path
                d="M18 6a6 6 0 1 1 0 12 6 6 0 0 1 0-12zm0 14c-6 0-10 4-10 10h20c0-6-4-10-10-10z"
              />
            </svg>
            <span class="nav-text">About</span></a
          >
        </li>
        <li>
          <a href="destination.html">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="36"
              height="36"
              viewBox="0 0 36 36"
              fill="#B519DD"
            >
              <!-- Destination / map pin icon -->
              <path
                d="M18 4C12 4 8 10 8 16c0 7 10 16 10 16s10-9 10-16c0-6-4-12-10-12zm0 20a6 6 0 1 1 0-12 6 6 0 0 1 0 12z"
              />
            </svg>
            <span class="nav-text">Destination</span></a
          >
        </li>
        <li>
          <a href="plan-your-trip.html">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="36"
              height="36"
              viewBox="0 0 36 36"
              fill="#B519DD"
            >
              <!-- Suitcase / Plan Your Trip icon -->
              <path d="M15 9h6v-3a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v3z" />
              <path d="M6 12h24v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V12z" />
            </svg>
            <span class="nav-text">Plan Your Trip</span></a
          >
        </li>
        <li>
          <a href="contact.html">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="36"
              height="36"
              viewBox="0 0 36 36"
              fill="#B519DD"
            >
              <!-- Envelope / Contact icon -->
              <path
                d="M6 10v16h24V10H6zm0-2h24a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2zm2 2l10 8 10-8"
              />
            </svg>
            <span class="nav-text">Contact</span></a
          >
        </li>
        <li>
          <a href="Login_form.html">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="36"
              height="36"
              viewBox="0 0 36 36"
              fill="#B519DD"
            >
              <!-- Padlock / Account icon -->
              <path d="M13 16v-3a5 5 0 0 1 10 0v3h-3v-3a2 2 0 0 0-4 0v3z" />
              <path d="M9 16h18v14a2 2 0 0 1-2 2H11a2 2 0 0 1-2-2V16z" />
            </svg>
            <span class="nav-text">Account</span></a
          >
        </li>
      </ul>
    </nav>
    <div class="cont">
      <div class="sign-up">
        <h2>Sign Up</h2>
        <div class="social-icons">
          <a href="#" class="google"><i class="fab fa-google"></i></a>
          <a href="#" class="facebook"><i class="fab fa-facebook-f"></i></a>
          <a href="#" class="twitter"><i class="fab fa-twitter"></i></a>
          <a href="#" class="linkedin"><i class="fab fa-linkedin-in"></i></a>
        </div>
        <form>
          <input type="text" placeholder="Fullname" required class="pass" />
          <input type="email" placeholder="Email" required class="pass" />
          <input type="password" placeholder="Password" required class="pas" />
          <button class="btn">Sign Up</button>
        </form>
      </div>
      <div class="purple-side">
        <h2>Welcome Back</h2>
        <p>
          Already have an account? Great! Just sign in to continue your journey
          with us.
        </p>
        <a href="Login_form.html"><button class="btn-outline">Login</button></a>
      </div>
    </div>
    <script>
      function myFunction() {
        var nav = document.getElementById("mynav");
        nav.classList.toggle("open");

        if (nav.classList.contains("open")) {
          document.body.classList.add("no-scroll");
        } else {
          document.body.classList.remove("no-scroll");
        }
      }
    </script>
  </body>
</html>
